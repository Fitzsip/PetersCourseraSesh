<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Flight Overhead</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Samsung TV web APIs (only present on the TV; harmless 404 in a desktop browser). -->
  <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
  <div id="stage">
    <section id="radar-wrap">
      <canvas id="radar"></canvas>
    </section>

    <aside id="side">
      <div id="clock">--:--</div>
      <div id="place"></div>
      <div id="summary"></div>
      <div id="jetcount"></div>
      <h2>Nearby</h2>
      <ol id="nearby"></ol>
      <div id="touch-bar">
        <button id="btn-settings" type="button">Settings</button>
        <button id="btn-jets" type="button">Jets &amp; helis</button>
        <button id="btn-test" type="button">Test alert</button>
      </div>
      <div id="hint">
        <span class="key">&#9650;&#9660;</span> select plane
        <span class="key">OK</span> details / settings
        <span class="key green">&#9679;</span> jets &amp; helicopters
        <span class="key red">&#9679;</span> test alert
        <span class="key">BACK</span> exit
      </div>
      <div id="status"></div>
    </aside>

    <div id="alerts"></div>
    <div id="details"></div>

    <div id="jetlog" class="hidden">
      <div class="panel">
        <h1>Private jets &amp; helicopters &middot; last 24 hours</h1>
        <p class="jl-hint">Tap one to open it in Flightradar24.</p>
        <div class="jetlog-body">
          <ol id="jetlog-list"></ol>
          <div id="jetlog-qr">
            <canvas id="jetlog-qr-code"></canvas>
            <div id="jetlog-qr-caption" class="qr-caption"></div>
          </div>
        </div>
        <button id="jetlog-close" type="button" class="row">Close</button>
      </div>
    </div>

    <div id="settings" class="hidden">
      <div class="panel">
        <h1>Settings</h1>
        <p class="sub">Use &#9650;&#9660; to move, &#9664;&#9654; or OK to change, OK on a number to type it.</p>
        <div id="settings-rows"></div>
        <div class="buttons">
          <button id="settings-save" class="row" tabindex="0">Save</button>
          <button id="settings-cancel" class="row" tabindex="0">Cancel</button>
        </div>
        <div id="settings-error"></div>
        <div id="settings-version"></div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/providers.js"></script>
  <script src="js/history.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/geocode.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/jetlog.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/tracker.js"></script>
  <script src="js/radar.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
