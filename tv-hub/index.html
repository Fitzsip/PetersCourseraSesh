<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, user-scalable=no">
  <title>TV Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">

    <!-- HOME -->
    <section id="home" class="screen active">
      <header class="topbar layer">
        <div>
          <div id="clock" class="clock">--:--</div>
          <div id="date" class="date"></div>
        </div>
        <div class="topbar-right">
          <div class="brand">TV Hub <span id="demo-badge" class="badge hidden">Demo mode</span></div>
          <div id="hotkeys" class="hotkeys"></div>
        </div>
      </header>

      <div class="hero">
        <div class="hero-info layer">
          <div class="eyebrow">Live TV</div>
          <h1 id="hero-channel">Pick a channel</h1>
          <div id="hero-now" class="now"></div>
          <div id="hero-next" class="next"></div>
          <div class="hero-hint">Press <b>OK</b> on a channel to watch, or type a channel number</div>
        </div>
        <div id="preview" class="preview">
          <div id="preview-fallback" class="preview-fallback"><span></span></div>
        </div>
      </div>

      <div class="rows layer">
        <div class="row-title">Your apps</div>
        <div id="row-apps" class="nav-row tiles"></div>

        <div class="row-title">Live channels</div>
        <div id="row-channels" class="nav-row tiles"></div>

        <div id="row-tools" class="nav-row tools"></div>
      </div>
    </section>

    <!-- FULL SCREEN LIVE TV -->
    <section id="watch" class="screen">
      <div id="watch-fallback" class="watch-fallback"><span></span></div>
      <div id="banner" class="banner">
        <div class="banner-num" id="banner-num"></div>
        <div>
          <div class="banner-name" id="banner-name"></div>
          <div class="banner-now" id="banner-now"></div>
        </div>
        <div class="banner-hint">CH ▲▼ change · BACK home</div>
      </div>
    </section>

    <!-- SETTINGS -->
    <section id="settings" class="screen overlay">
      <div class="panel">
        <h2>Settings</h2>
        <div id="settings-body" class="scroll"></div>
        <div class="panel-hint">BACK to close · changes save automatically</div>
      </div>
    </section>

    <!-- PICKER (installed apps / TV channels) -->
    <section id="picker" class="screen overlay">
      <div class="panel">
        <h2 id="picker-title"></h2>
        <div id="picker-body" class="scroll"></div>
        <div class="panel-hint">OK to add or remove · BACK when done</div>
      </div>
    </section>

    <div id="digits" class="digits hidden"></div>
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="js/defaults.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
