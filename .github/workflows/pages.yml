# Publishes the Charge Ireland map (ev-charge-ireland/) to GitHub Pages, plus the
# Chalkboard FC app's privacy policy at /chalkboard-fc/privacy.html,
# whenever master changes. Requires Settings → Pages → Source: "GitHub Actions".
name: Deploy map to GitHub Pages

on:
  push:
    branches: [master]
    paths: ['ev-charge-ireland/**', 'chalkboard-fc/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and publish are separate jobs (GitHub's recommended layout): publishing in the same
  # job as the upload sometimes ran before GitHub had registered the files, failing with
  # 'No artifacts named "github-pages" were found'.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        working-directory: ev-charge-ireland
        run: npm test

      - name: Collect site files
        run: |
          mkdir _site
          cp -r ev-charge-ireland/index.html ev-charge-ireland/styles.css \
                ev-charge-ireland/config.js ev-charge-ireland/js _site/
          mkdir -p _site/chalkboard-fc
          cp chalkboard-fc/privacy.html _site/chalkboard-fc/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
