# Publishes the Charge Ireland map (ev-charge-ireland/) to GitHub Pages
# whenever master changes. Requires Settings → Pages → Source: "GitHub Actions".
name: Deploy map to GitHub Pages

on:
  push:
    branches: [master]
    paths: ['ev-charge-ireland/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        working-directory: ev-charge-ireland
        run: npm test

      - name: Collect site files
        run: |
          mkdir _site
          cp -r ev-charge-ireland/index.html ev-charge-ireland/styles.css \
                ev-charge-ireland/config.js ev-charge-ireland/js _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
